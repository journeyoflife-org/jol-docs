name: docs-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Lint & link-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mise (pinned)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          version: "2026.11.0"

      - name: markdownlint
        run: npx --yes markdownlint-cli@0.41.0 "**/*.md" --config .markdownlint.yaml --ignore ".venv/**"

      - name: Link check (lychee)
        # Pinned by immutable SHA to v2.9.0. The floating @v1 tag resolves to a
        # pre-2.0.2 commit vulnerable to CVE-2024-48908 (arbitrary code injection in
        # the composite action). SHA pinning also prevents tag-mutation attacks.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --no-progress
            --retry-wait-time 5
            --max-retries 3
            --exclude 'github\.com/journeyoflife-org/jol-dr'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
