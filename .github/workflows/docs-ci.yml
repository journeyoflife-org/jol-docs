name: docs-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Lint & link-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: markdownlint
        run: npx --yes markdownlint-cli@0.41.0 "**/*.md" --config .markdownlint.yaml --ignore ".venv/**"

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --no-progress
            --retry-wait-time 5
            --max-retries 3
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
