name: compliance-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: Document control & ADR/RoPA coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Every ADR and GDPR record has a Document-Control block
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          for f in adr/ADR-*.md gdpr/*.md architecture/*.md compliance/*.md; do
            case "$f" in
              */README.md) continue ;;
            esac
            grep -q '^## Document Control' "$f" || { echo "MISSING '## Document Control': $f"; fail=1; }
            grep -q 'Document ID' "$f"          || { echo "MISSING 'Document ID' field: $f"; fail=1; }
            grep -q 'Classification' "$f"       || { echo "MISSING 'Classification' field: $f"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Document-Control blocks present for all ADRs, architecture docs, and GDPR records."

      - name: Every ADR file is listed in the ADR index
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          for f in adr/ADR-*.md; do
            id="$(basename "$f" .md | grep -oE 'ADR-[0-9]+')"
            grep -q "$id" adr/README.md || { echo "UNINDEXED ADR: $id not in adr/README.md"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "ADR index covers all ADR files."

      - name: ADR-011 (referenced by site spokes) exists and is Accepted
        run: |
          set -euo pipefail
          test -f adr/ADR-011-hub-and-spoke-monorepo-federation.md
          grep -qi 'Accepted' adr/ADR-011-hub-and-spoke-monorepo-federation.md
          echo "ADR-011 present and Accepted."

      - name: GDPR Article 30 records of processing exist
        run: |
          set -euo pipefail
          test -f gdpr/ropa-controller.md
          test -f gdpr/ropa-processor.md
          grep -qi 'Article 30' gdpr/ropa-controller.md
          echo "Art. 30 controller and processor records present."

      - name: Governance spine present
        run: |
          set -euo pipefail
          test -f adr/README.md
          test -f architecture/system-landscape.md
          test -f gdpr/README.md
          test -f compliance/control-matrix.md
          echo "Governance spine present."
