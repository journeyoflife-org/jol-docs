name: ADR Proposal
description: Propose a new architecture decision record, or supersede an existing one.
title: "[adr] "
labels: ["adr", "architecture", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new Architecture Decision Record (ADR). See guides/adding-an-adr.md for the
        full workflow. An ADR records a decision that is hard to reverse and affects the platform
        broadly. Once Accepted, an ADR is immutable — supersede it with a new ADR rather than
        editing it.
  - type: input
    id: title
    attributes:
      label: Proposed decision title
      description: A short, imperative or noun phrase describing the decision.
      placeholder: Hub-and-Spoke Monorepo Federation
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Is this a platform-wide decision or local to one service?
      options:
        - Platform-wide (belongs in jol-docs/adr/)
        - Service-local (belongs in the service repository, indexed here)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is the problem or situation that forces a decision? What constraints apply (compliance, scale, tenancy, cost)?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
      description: What is the decision? State it in active voice ("We will ...").
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What options were rejected, and why?
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: What becomes easier or harder as a result? Include compliance, operational, and technical consequences.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to the code, config, benchmarks, or tickets that ground this decision.
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have checked adr/README.md and this decision is not already recorded.
          required: true
        - label: This report contains no personal data, credentials, or real tenant identifiers.
          required: true
